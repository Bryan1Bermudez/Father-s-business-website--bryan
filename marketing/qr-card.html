<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Millennium Flooring Remodeling QR card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  @page { size: 4in 6in; margin: 0; }
  html, body { margin: 0; background: #e6ddcf; }
  .card {
    width: 4in; height: 6in; box-sizing: border-box;
    padding: 0.35in 0.35in 0.3in;
    background: #e6ddcf; color: #2e241c;
    font-family: "Source Sans 3", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .mark { width: 0.42in; height: 0.42in; margin-bottom: 0.08in; }
  .mark rect { fill: #a04726; } .mark rect.alt { fill: #d6bf9f; }
  h1 { font-family: "Fraunces", Georgia, serif; font-size: 30pt; line-height: 1; margin: 0; }
  .sub { font-weight: 600; font-size: 9pt; letter-spacing: 0.16em; text-transform: uppercase; color: #5c4e42; margin-top: 4pt; }
  .services { font-size: 10.5pt; color: #a04726; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin: 12pt 0 10pt; }
  .qr { background: #fff; padding: 0.08in; border-radius: 6px; box-shadow: 0 0 0 1px #cbbca8; }
  .qr img { width: 2.45in; height: 2.45in; display: block; }
  .scan { font-family: "Fraunces", Georgia, serif; font-size: 15pt; margin: 10pt 0 2pt; }
  .scan-es { font-size: 10.5pt; color: #5c4e42; margin: 0; }
  .phone { margin-top: auto; font-weight: 600; font-size: 15pt; }
  .phone small { display: block; font-weight: 400; font-size: 9.5pt; color: #5c4e42; }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="2" y="2" width="13" height="13" rx="2"/><rect x="17" y="2" width="13" height="13" rx="2" class="alt"/>
      <rect x="2" y="17" width="13" height="13" rx="2" class="alt"/><rect x="17" y="17" width="13" height="13" rx="2"/>
    </svg>
    <h1>Millennium</h1>
    <div class="sub">Flooring Remodeling</div>
    <div class="services">Tile · Bathrooms · Pools</div>
    <div class="qr"><img src="qr-code.svg" alt="QR code to the Millennium Flooring Remodeling website"></div>
    <p class="scan">Scan to see our work</p>
    <p class="scan-es">Escanee para ver nuestro trabajo</p>
    <div class="phone">786-873-8233<small>Free estimates · Se habla español</small></div>
  </div>
</body>
</html>
